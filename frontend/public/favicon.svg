<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f192d" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="emeraldArc" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Gauge Arc (Pressure Meter) -->
  <path d="M16 44 A 20 20 0 1 1 48 44" fill="none" stroke="url(#emeraldArc)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Needle & Center Pivot -->
  <circle cx="32" cy="22" r="3" fill="#10b981" />
  <circle cx="32" cy="36" r="4.5" fill="#ffffff" />
  <line x1="32" y1="36" x2="32" y2="22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
</svg>